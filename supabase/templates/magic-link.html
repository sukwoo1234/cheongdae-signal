<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>청대 시그널 로그인</title>
  </head>
  <body style="margin:0;padding:0;background:#f2f5f9;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;color:#071b33;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">청대 시그널 로그인 링크가 도착했어요. 15분 안에 확인해주세요.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f2f5f9;">
      <tr>
        <td align="center" style="padding:32px 14px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#ffffff;border:1px solid #dce4ee;border-radius:22px;overflow:hidden;">
            <tr>
              <td style="height:6px;background:#15bfa9;font-size:0;line-height:0;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:34px 34px 10px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td width="34" height="34" align="center" valign="middle" style="width:34px;height:34px;border-radius:10px;background:#071b33;color:#ffffff;font-size:13px;font-weight:800;">S</td>
                    <td style="padding-left:10px;font-size:15px;font-weight:800;color:#071b33;">청대 시그널</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 34px 34px;">
                <p style="margin:0 0 10px;color:#0ca18e;font-size:12px;font-weight:700;letter-spacing:1px;">LOGIN LINK</p>
                <h1 style="margin:0;color:#071b33;font-size:27px;line-height:1.35;letter-spacing:-0.8px;">오늘의 시그널에<br>참여할 준비가 됐어요.</h1>
                <p style="margin:18px 0 0;color:#637083;font-size:14px;line-height:1.75;">
                  아래 버튼을 눌러 청대 시그널에 로그인해주세요.<br>
                  링크는 발송 후 <strong style="color:#253a55;">15분 동안</strong>, 한 번만 사용할 수 있습니다.
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin-top:26px;">
                  <tr>
                    <td align="center" bgcolor="#071b33" style="border-radius:11px;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;">청대 시그널 시작하기&nbsp; →</a>
                    </td>
                  </tr>
                </table>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-top:28px;background:#f3f6fa;border-radius:12px;">
                  <tr>
                    <td style="padding:15px 16px;color:#637083;font-size:12px;line-height:1.65;">
                      <strong style="color:#253a55;">버튼이 열리지 않나요?</strong><br>
                      아래 주소를 복사해 브라우저 주소창에 붙여넣어 주세요.
                    </td>
                  </tr>
                </table>
                <p style="margin:12px 0 0;word-break:break-all;color:#0b8f7e;font-size:11px;line-height:1.6;">
                  <a href="{{ .ConfirmationURL }}" style="color:#0b8f7e;text-decoration:underline;">{{ .ConfirmationURL }}</a>
                </p>
                <div style="height:1px;background:#e4eaf1;margin:28px 0 20px;"></div>
                <p style="margin:0;color:#8a96a6;font-size:11px;line-height:1.7;">
                  본인이 요청하지 않았다면 이 메일을 무시해도 됩니다.<br>
                  청대 시그널 운영팀 · 청주대학교 학생 전용
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;color:#9aa6b5;font-size:10px;">© 청대 시그널</p>
        </td>
      </tr>
    </table>
  </body>
</html>
